# Konfigurasi tema SIPALDO-PAGENTAN (aman untuk Streamlit Community Cloud)
# Catatan: alamat/port server TIDAK diatur di sini agar tidak bentrok dengan
# pengaturan platform Streamlit Cloud. Saat dijalankan lokal, default-nya
# http://localhost:8501.

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#15803D"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
